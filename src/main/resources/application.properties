# Use wildcard "*" to expose all endpoints
# Can also expose individual endpoints with a comma-delimited list

spring.application.name=buchhandlung

spring.datasource.url=jdbc:mysql://localhost:3306/bookstore
spring.datasource.username=bookstore_app
spring.datasource.password=${MYSQL_PASSWORD:CHANGE_ME_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Configure JPA/Hibernate to auto create the tables

# the "create" config first drops the table and then creates, all data is lost
# spring.jpa.hibernate.ddl-auto=create

# the "update" config will keep existing data in the table
spring.jpa.hibernate.ddl-auto=update

spring.main.banner-mode=off

# logging.level.root=warn

# management.endpoints.web.exposure.include=health, info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
server.port=${PORT:8080}

# Exclude individual endpoints with a comma-delimited list
# management.endpoints.web.exposure.exclude=health, info

info.app.name=Buchhandlung Christiansen
info.app.description=Buchdaten aus dem Buchhandlung Christiansen
info.app.version=1.0.0

bookstore.name=Buchhandlung Christiansen

# CORS — comma-separated list if you need more than one origin (e.g. Vue dev server)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
